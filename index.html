<head>
<meta charset="utf-8">

<title>Radio City Walk</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07080b">
<meta name="mobile-web-app-capable" content="yes">
<!-- SomaFM rechaza el audio si se envía la página de origen; el video de YouTube lleva su propia política -->

<style>
/* Layout: video a pantalla completa, panel tipo "radio de auto" abajo a la izquierda, reloj arriba a la derecha */
:root{
  --ink:#f3efe6;
  --dim:#b9b3a6;
  --glass:rgba(14,16,22,.62);
  --line:rgba(243,239,230,.18);
  --sodium:#ffb347;   /* luz de farol de calle */
  --live:#ff4d4d;
  --display:"Archivo Black", Impact, "Arial Black", sans-serif;
  --body:"Karla", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#07080b;color:var(--ink);font-family:var(--body);overflow:hidden}

#stage{position:fixed;inset:0;overflow:hidden;background:#07080b}
#bokeh{position:absolute;inset:0;width:100%;height:100%}
/* iframe sobredimensionado para cubrir como "cover" */
#yt{position:absolute;top:50%;left:50%;width:177.78vh;height:56.25vw;min-width:100vw;min-height:100vh;transform:translate(-50%,-50%);border:0;pointer-events:none}
#shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 22%,transparent 55%,rgba(0,0,0,.65) 100%)}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:20px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));z-index:3}
.brand{font-family:var(--display);font-size:clamp(18px,2.4vw,28px);letter-spacing:.02em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--sodium);margin-top:6px;text-transform:uppercase}
.clock{font-family:var(--mono);text-align:right;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.clock b{display:block;font-weight:500;font-size:clamp(22px,3vw,34px);font-variant-numeric:tabular-nums}
.clock span{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

.dock{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:3;
  width:min(460px,calc(100vw - 40px));display:grid;gap:12px;transition:opacity .6s}
body.idle .dock,body.idle .top,body.idle .tools{opacity:0;pointer-events:none}
/* Línea mínima visible con los controles ocultos */
.ticker{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:3;
  display:flex;align-items:center;gap:10px;max-width:min(70vw,640px);padding:7px 12px;border-radius:4px;
  background:rgba(7,8,11,.55);font-family:var(--mono);font-size:13px;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .6s}
.ticker b{font-weight:500;color:var(--sodium);white-space:nowrap}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.idle.on .ticker{opacity:1}
body.idle{cursor:none}

.radio{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:12px}
.onair{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:#555}
.playing .dot{background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.station{font-family:var(--display);font-size:24px;line-height:1.05}
.np{font-family:var(--mono);font-size:13px;color:var(--sodium);min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--ink)}
.play{width:52px;height:52px;border-radius:50%;border:2px solid var(--sodium);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none}
.play:hover{background:rgba(255,179,71,.14)}
.play svg{width:20px;height:20px;fill:var(--sodium)}
.vol{flex:1;min-width:120px;accent-color:var(--sodium)}
select{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:4px;padding:8px 10px;flex:1;min-width:0}
select option{background:#15171d}

.dial{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:3px;background:transparent;cursor:pointer;letter-spacing:.04em}
.chip[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium)}

details.walk{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:6px;padding:12px 18px}
details.walk summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);list-style:none}
details.walk summary::-webkit-details-marker{display:none}
details.walk summary::before{content:"▸ ";color:var(--sodium)}
details[open].walk summary::before{content:"▾ "}
.walkbody{display:grid;gap:10px;margin-top:12px;font-size:13px;color:var(--dim)}
.walkbody input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.btn{background:var(--sodium);color:#1a1205;border:0;border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer}
.walkbody a{color:var(--ink)}
.err{color:var(--live)}

.tools{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:8px;transition:opacity .6s}
.tools button{background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:12px}

button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.playing .dot{animation:none}}
@media (max-width:560px){.tools{top:90px;bottom:auto}}
/* Celular y control remoto: objetivos táctiles grandes */
@media (pointer:coarse){
  .play{width:64px;height:64px}
  .play svg{width:24px;height:24px}
  .chip{font-size:13px;padding:9px 12px}
  .btn,select,.walkbody input{padding:11px 14px;font-size:15px}
  .tools button{padding:11px 14px;font-size:13px}
  .vol{height:32px}
}
/* Celular en horizontal: panel más compacto para ver la ciudad */
@media (orientation:landscape) and (max-height:500px){
  .dock{width:min(420px,48vw);gap:8px}
  .radio{padding:10px 14px;gap:8px}
  .station{font-size:18px}
  .dial{max-height:84px;overflow-y:auto}
  details.walk{padding:8px 14px}
  .top{padding-top:10px}
  .tools{top:auto;bottom:max(20px,env(safe-area-inset-bottom,0px))}
}
.tapzone{position:fixed;inset:0;z-index:2;display:none}
body.idle .tapzone{display:block}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bokeh"></canvas>
  <div id="ytwrap"></div>
  <div id="shade"></div>
</div>

<header class="top">

  <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
</header>

<section class="dock">
  <div class="radio" id="radio">
    <div class="onair"><span class="dot"></span><span id="status">Detenido</span></div>
    <div class="station" id="stationName">—</div>

      <button class="play" id="playBtn" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4l14 8-14 8z"/></svg></button>

    </div>
    <div class="dial" id="dial"></div>
    <div id="ytAudioWrap" style="position:fixed;width:240px;height:180px;left:-400px;top:0;opacity:0;pointer-events:none" aria-hidden="true"></div>
  </div>

  <details class="walk" id="walkPanel">
    <summary>Caminata</summary>
    <div class="walkbody">
      <div class="row">
        <select id="citySel" aria-label="Ciudad"></select>
        <button class="btn" id="nextWalk">Otra al azar</button>
      </div>
      <div id="ytMsg"></div>
      <div class="row">
        <input id="ytInput" placeholder="O pega un link de YouTube propio">
        <button class="chip" id="ytGo">Usar</button>
      </div>
      <div><a id="ytLink" href="#" target="_blank" rel="noopener">Ver este video en YouTube</a></div>
    </div>
  </details>
</section>

<div class="tools">
  <button id="hideBtn">Ocultar controles</button>
  <button id="fsBtn">Pantalla completa</button>
</div>
<div class="tapzone" id="tapzone" aria-hidden="true"></div>
<div class="ticker" id="ticker" aria-live="polite"><b id="tkStation"></b><span id="tkSong"></span></div>

<audio id="audio" preload="none"></audio>

<script>

const BIRP_BY_ID = Object.fromEntries(BIRP.map(([a,t,id])=>[id,a+" — "+t]));
let ytAudio = null, ytAudioReady = false, ytWant = false, ytLoaded = null; // ytLoaded: id de la emisora cargada
function ensureYtAudio(){
  if(ytAudio || !(window.YT && YT.Player)) return;
  const f = ytFrame("ytAudio", "?controls=0", $("ytAudioWrap"));
  ytAudio = new YT.Player(f, {events:{
    onReady:()=>{ ytAudioReady = true; if(ytWant) startYt(); },
    onStateChange:e=>{
      if(!current.yt) return;
      if(e.data===YT.PlayerState.PLAYING){ setPlayingUI(true); showYtTitle(); }
    },
    onError:()=>{ if(ytWant && ytAudio) setTimeout(()=>ytAudio.nextVideo(), 500); }
  }});
}
function showYtTitle(){
  try{ const id = ytAudio.getVideoData().video_id; $("np").textContent = "♪ " + (BIRP_BY_ID[id] || ytAudio.getVideoData().title); }catch(e){}
}
function startYt(){
  ytWant = true;
  if(!ytAudioReady){ ensureYtAudio(); $("np").textContent="Conectando con YouTube…"; return; }
  ytAudio.unMute(); ytAudio.setVolume(Math.round(+$("vol").value*100));
  if(ytLoaded===current.id){ ytAudio.playVideo(); return; }
  if(current.list){
    // Lista de YouTube: parte en una canción al azar y sigue en modo aleatorio
    ytAudio.loadPlaylist({list:current.list, listType:"playlist", index:Math.random()*50|0});
    setTimeout(()=>{ try{ ytAudio.setShuffle(true); ytAudio.setLoop(true); }catch(e){} }, 2000);
  } else {
    const ids = BIRP.map(s=>s[2]);
    for(let i=ids.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [ids[i],ids[j]]=[ids[j],ids[i]]; }
    ytAudio.loadPlaylist(ids.slice(0,150), 0);
    setTimeout(()=>{ try{ ytAudio.setLoop(true); }catch(e){} }, 1500);
  }
  ytLoaded = current.id;
}
function stopYt(){ ytWant=false; try{ ytAudio && ytAudio.pauseVideo(); }catch(e){} }

function tune(s, autoplay){
  const was = current;
  current = s; store.set("station", s.id);
  if(was.yt && was!==s) stopYt();
  if(!s.yt){ audio.src = s.url + (s.url.includes("?")?"&":"?") + "t=" + Date.now(); }
  else { audio.pause(); audio.removeAttribute("src"); }
  renderDial();
  $("np").textContent = autoplay ? "Conectando…" : "Presiona play";
  if(autoplay) start(); else setPlayingUI(false);
  pollNowPlaying();
}

/* Mantener la pantalla encendida mientras suena (clave al duplicar pantalla al TV) */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null); }
    if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && audio.dataset.wanted==="1") keepAwake(true); });

function mediaSession(){
  if(!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({title: current.name, artist: "Radio City Walk", artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
  navigator.mediaSession.setActionHandler("play", ()=>{ if(!current.yt) audio.src=current.url; start(); });
  navigator.mediaSession.setActionHandler("pause", stop);
  navigator.mediaSession.setActionHandler("nexttrack", ()=>{ const i=STATIONS.indexOf(current); tune(STATIONS[(i+1)%STATIONS.length], true); });
}

function start(){
  audio.dataset.wanted = "1";
  keepAwake(true); mediaSession();
  if(current.yt){ startYt(); return; }
  if(!audio.src) audio.src = current.url;
  audio.play().then(()=>setPlayingUI(true)).catch(()=>{
    $("np").textContent = "No se pudo conectar. Prueba otra emisora.";
    setPlayingUI(false);
  });
}
function stop(){
  audio.dataset.wanted = "0";
  audio.pause(); audio.removeAttribute("src"); audio.load(); // corta el stream, al volver retoma en vivo
  stopYt();
  keepAwake(false);
  setPlayingUI(false);
}
function isPlaying(){ return current.yt ? ytWant : !audio.paused; }
$("playBtn").onclick = ()=> isPlaying() ? stop() : (current.yt || (audio.src = current.url), start());
audio.addEventListener("playing", ()=>setPlayingUI(true));
audio.addEventListener("error", ()=>{
  if(audio.dataset.wanted==="1" && !current.yt){ $("np").textContent="Señal perdida, reintentando…"; setTimeout(()=>{audio.src=current.url;start()},4000); }
});
$("vol").value = store.get("vol") ?? 0.8;
audio.volume = +$("vol").value;
$("vol").oninput = e=>{audio.volume=+e.target.value; store.set("vol", e.target.value); try{ ytAudio && ytAudio.setVolume(Math.round(audio.volume*100)); }catch(err){} };

async function pollNowPlaying(){
  clearTimeout(npTimer);
  if(current.soma){
    try{
      const r = await fetch("https://somafm.com/songs/"+current.soma+".json",{cache:"no-store"});
      const j = await r.json();
      const t = j.songs && j.songs[0];
      if(t) $("np").textContent = "♪ " + t.artist + " — " + t.title;
    }catch(e){}
  } else if(current.yt){
    if(ytWant) showYtTitle();
  } else if(!audio.paused){
    $("np").textContent = "♪ " + current.name + " en vivo";
  }
  npTimer = setTimeout(pollNowPlaying, 30000);
}

/* ---------- Video de fondo ---------- */
function ytId(text){
  text = (text||"").trim();
  if(/^[\w-]{11}$/.test(text)) return text;
  const m = text.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

const ALL = WALKS.flatMap(([city,country,vids])=>vids.map(([id,t])=>({id,t,city,country})));
let player = null, curVid = null, failStreak = 0;

const sel = $("citySel");
sel.innerHTML = '<option value="*">Todas las ciudades ('+ALL.length+' caminatas)</option>' +
  WALKS.map(([c,p,v])=>`<option value="${c}">${c}, ${p} (${v.length})</option>`).join("");
sel.value = store.get("city") || "*";
if(!sel.value) sel.value="*";
sel.onchange = ()=>{ store.set("city", sel.value); randomWalk(); };

function pool(){ return sel.value==="*" ? ALL : ALL.filter(v=>v.city===sel.value); }
function randomWalk(fromButton){
  let p = pool().filter(v=>!curVid || v.id!==curVid.id);
  if(!p.length){
    // La ciudad elegida no tiene más caminatas: pasar a "Todas las ciudades"
    if(fromButton===true && sel.value!=="*"){
      $("ytMsg").textContent = sel.value + " tiene una sola caminata. Te llevo a otra ciudad al azar.";
      sel.value = "*"; store.set("city","*");
    }
    p = ALL.filter(v=>!curVid || v.id!==curVid.id);
  }
  playVid(p[Math.random()*p.length|0]);
}
function playVid(v){
  curVid = v;
  $("cityLabel").textContent = v.city ? "Caminando por " + v.city + (v.country?", "+v.country:"") : "Caminata propia";
  $("ytLink").href = "https://www.youtube.com/watch?v=" + v.id + (v.t?"&t="+v.t:"");
  $("bokeh").style.display = "none";
  if(player && player.loadVideoById){ player.loadVideoById({videoId:v.id, startSeconds:v.t||0}); }
  else if(window.YT && YT.Player){ makePlayer(); }
}
/* Iframe de YouTube con su propia política de referrer (YouTube la exige; la página usa no-referrer para la radio) */
function ytFrame(id, query, parent){
  const f=document.createElement("iframe");
  f.id = id;
  f.allow = "autoplay; encrypted-media";
  f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
  f.src = "https://www.youtube.com/embed/" + query + (query.includes("?")?"&":"?") + "enablejsapi=1&playsinline=1&origin=" + encodeURIComponent(location.origin);
  parent.appendChild(f);
  return f;
}
function makePlayer(){
  const wrap=$("ytwrap"); wrap.innerHTML='';
  const f = ytFrame("yt", curVid.id+"?autoplay=1&mute=1&controls=0&start="+(curVid.t||0)+"&rel=0&iv_load_policy=3&modestbranding=1&disablekb=1", wrap);
  player = new YT.Player(f, {
    events:{
      onReady:e=>{ e.target.mute(); e.target.playVideo(); },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING){ failStreak=0; $("ytMsg").textContent=""; }
        if(e.data===YT.PlayerState.ENDED) randomWalk();
      },
      onError:e=>{
        failStreak++;
        if(e.data===153 || failStreak>5){
          $("ytMsg").innerHTML = location.protocol==="file:"
            ? '<span class="err">YouTube no permite reproducir videos desde un archivo local. Ábrela desde su link de internet o con abrir_radio.bat.</span>'
            : '<span class="err">YouTube no está cargando videos ahora. Revisa la conexión y toca "Otra al azar".</span>';
          $("bokeh").style.display="block"; return;
        }
        $("ytMsg").textContent="Ese video ya no está disponible, buscando otro…";
        setTimeout(randomWalk, 800);
      }
    }
  });
}
window.onYouTubeIframeAPIReady = ()=>{ if(curVid) makePlayer(); ensureYtAudio(); };
(function loadYT(){ const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

$("nextWalk").onclick = ()=>randomWalk(true);
$("ytGo").onclick = ()=>{
  const id = ytId($("ytInput").value);
  if(!id){ $("ytMsg").innerHTML='<span class="err">No reconozco ese link. Copia la URL completa del video.</span>'; return; }
  playVid({id, t:0}); $("ytInput").value="";
};
$("ytInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("ytGo").click(); });

/* ---------- Fondo de luces cuando no hay video ---------- */
(function bokeh(){
  const c=$("bokeh"), x=c.getContext("2d");
  const hues=["255,179,71","255,120,90","120,170,255","255,220,160"];
  let W,H,dots=[];
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;
    dots=Array.from({length:55},()=>({x:Math.random()*W,y:H*.35+Math.random()*H*.65,r:(8+Math.random()*40)*devicePixelRatio,v:(.1+Math.random()*.4)*devicePixelRatio,c:hues[Math.random()*4|0],a:.08+Math.random()*.25}))}
  size(); addEventListener("resize",size);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function frame(){
    x.fillStyle="#07080b";x.fillRect(0,0,W,H);
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b0e1a");g.addColorStop(1,"#1a1010");x.fillStyle=g;x.fillRect(0,0,W,H);
    for(const d of dots){
      if(!still){d.x-=d.v; if(d.x<-d.r) d.x=W+d.r;}
      const rg=x.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      rg.addColorStop(0,`rgba(${d.c},${d.a})`);rg.addColorStop(1,`rgba(${d.c},0)`);
      x.fillStyle=rg;x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.fill();
    }
    if(c.style.display!=="none") requestAnimationFrame(frame); else setTimeout(()=>requestAnimationFrame(frame),1000);
  })();
})();

/* ---------- Reloj, pantalla completa, modo inactivo ---------- */
function tick(){
  const d=new Date();
  $("time").textContent=d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  $("date").textContent=d.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,10000);

$("fsBtn").onclick=()=>{
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  document.documentElement.requestFullscreen()
    .then(()=>screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(()=>{}))
    .catch(()=>{});
};

let idleT;
function goIdle(){
  const a=document.activeElement;
  if(a && (a.tagName==="INPUT" || a.tagName==="SELECT")){ wake(); return; } // no ocultar mientras escribe o elige
  $("walkPanel").open=false;
  document.body.classList.add("idle");
}
function wake(){document.body.classList.remove("idle");clearTimeout(idleT); idleT=setTimeout(goIdle,5000)}
["mousemove","keydown","touchstart"].forEach(e=>addEventListener(e,wake,{passive:true}));
wake();

addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){e.preventDefault();$("playBtn").click();}
  if(e.key==="f") $("fsBtn").click();
});

/* ---------- Inicio ---------- */
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
$("tapzone").addEventListener("click", e=>{ e.preventDefault(); wake(); });
$("hideBtn").addEventListener("click", e=>{ e.stopPropagation(); clearTimeout(idleT); setTimeout(goIdle,50); });
/* Ticker: estación y canción actuales */
function syncTicker(){
  $("tkStation").textContent = current.name;
  $("tkSong").textContent = ($("np").textContent||"").replace(/^♪\s*/,"");
  document.body.classList.toggle("on", $("radio").classList.contains("playing"));
}
new MutationObserver(syncTicker).observe($("np"),{childList:true,characterData:true,subtree:true});
new MutationObserver(syncTicker).observe($("radio"),{attributes:true,attributeFilter:["class"]});
renderDial();
randomWalk();
addEventListener("keydown",e=>{ if(e.target.tagName!=="INPUT" && e.key==="n") randomWalk(true); });
pollNowPlaying();
</script>
</body>
